apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: blitzy-WebVella-ERP
  # Corrected: this descriptor previously advertised a "monolith decomposition —
  # cloud-native microservices, serverless architecture". No such work exists in
  # this repository and none was performed: there is no container definition, no
  # orchestration manifest and no service split anywhere in the tree, and the AAP
  # excludes all of it. What this repository does contain is the OWASP Top 10
  # audit and its remediation, so that is what the descriptor now says.
  description: WebVella ERP — .NET 10 / ASP.NET Core modular monolith on PostgreSQL, with a
    completed OWASP Top 10 (2021) security audit and remediation.
  # 'infrastructure', 'modernization' and 'refactor' are removed for the same
  # reason as the description: the AAP forbids architectural change, refactoring
  # beyond security requirements and any infrastructure work, so those tags
  # described work that was explicitly out of scope.
  tags:
  - audit
  - csharp
  - dotnet
  - security
  - web-app
  labels:
    blitzy.com/language: csharp
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: Blitzy-Sandbox/blitzy-WebVella-ERP
    backstage.io/source-location: url:https://github.com/Blitzy-Sandbox/blitzy-WebVella-ERP/tree/master/
  links:
  - url: https://github.com/Blitzy-Sandbox/blitzy-WebVella-ERP
    title: GitHub Repository
  - url: https://github.com/Blitzy-Sandbox/blitzy-WebVella-ERP/pull/1
    title: 'PR #1: OWASP Security Audit & Remediation'
    icon: github
  # The 'PR #2: Serverless Microservices Rewrite' link is removed: it named work
  # this repository does not contain. The 'blitzy/documentation' link is removed
  # too - that path does not exist in the tree, so the link resolved to a 404. The
  # audit report and its companions are linked instead, which is what the AAP
  # requires this descriptor to reference.
  - url: https://github.com/Blitzy-Sandbox/blitzy-WebVella-ERP/blob/master/docs/security/security-audit-report.md
    title: Security Audit Report — all 53 findings in the mandated eight-field format
    icon: docs
  - url: https://github.com/Blitzy-Sandbox/blitzy-WebVella-ERP/blob/master/docs/security/risk-register.md
    title: Security Risk Register — accepted risks and ongoing recommendations
    icon: docs
  - url: https://github.com/Blitzy-Sandbox/blitzy-WebVella-ERP/blob/master/SECURITY.md
    title: Security Policy — reporting channel and current posture
    icon: docs
  - url: https://github.com/Blitzy-Sandbox/blitzy-WebVella-ERP/tree/master/docs
    title: Documentation
    icon: docs
spec:
  type: website
  lifecycle: experimental
  owner: blitzy-sandbox
  system: blitzy-dotnet
